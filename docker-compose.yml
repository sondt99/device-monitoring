services:
  device-monitoring:
    build: .
    image: device-monitoring:local
    restart: unless-stopped
    ports:
      # Host port is overridable; scripts/up.sh picks the first free port
      # in 3000-3100 automatically when 3000 is taken. Bound to 0.0.0.0
      # explicitly so the app is reachable from the LAN regardless of the
      # Docker daemon's default bind address.
      - "0.0.0.0:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_PATH: /data/device-monitoring.sqlite
      STATIC_DIR: /app/public
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET to at least 32 random characters}
      # Encrypts notification-channel secrets at rest. Generate with: openssl rand -base64 32
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY — generate with `openssl rand -base64 32`}
      # Set SECURE_COOKIES=true only if serving over HTTPS (behind TLS terminator like nginx/Caddy)
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      # X-Forwarded-For trust for per-IP rate limits. Only behind a trusted
      # proxy: 'true' = one hop, '<N>' = N hops, '<CIDR>' = trusted proxy nets.
      # Leave 'false' for direct exposure (else clients can spoof their IP).
      TRUST_PROXY: ${TRUST_PROXY:-false}
      BEAT_RETENTION_DAYS: ${BEAT_RETENTION_DAYS:-30}
      ENABLE_STATUS_PAGE: ${ENABLE_STATUS_PAGE:-false}
      ENABLE_METRICS: ${ENABLE_METRICS:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME on first boot}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD to at least 12 characters on first boot}
    volumes:
      - device-monitoring-data:/data

volumes:
  device-monitoring-data: